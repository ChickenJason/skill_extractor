[project]
name = "skill-sentence-processor"
version = "0.7.0"
description = "Peer self-annotation, TRF, and instance-discrimination modules"
requires-python = ">=3.10,<3.11"
dependencies = [
  "openai>=2,<3",
  "numpy==1.26.4",
  "scikit-learn==1.6.1",
  "torch==2.5.1+cpu",
  "transformers==4.57.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
